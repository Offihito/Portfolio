<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Video Oynatıcı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .player-container {
            background: #222;
            border-radius: 10px;
            padding: 20px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        
        .player-title {
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            color: #00d4ff;
        }
        
        .video-wrapper {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .info-box {
            background: #333;
            border-left: 4px solid #00d4ff;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .info-box p {
            margin-bottom: 8px;
        }
        
        .info-box strong {
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-title">🎬 Video Oynatıcı</div>
        
        <div class="video-wrapper">
            <video controls>
                <source src="video.ogv" type="video/ogg">
                <source src="video.mp4" type="video/mp4">
                Tarayıcınız video tag'ini desteklemiyor.
            </video>
        </div>
        
        <div class="info-box">
            <p><strong>Kontroller:</strong></p>
            <p>▶ Play/Pause - Videoyu başlat/duraklat</p>
            <p>🔊 Volume - Sesi ayarla</p>
            <p>⏱ Seek - İleri/Geri al</p>
            <p>🖥 Fullscreen - Tam ekran</p>
            <p><strong>Not:</strong> Video dosyaları (video.ogv veya video.mp4) Portfolio klasöründe olmalı.</p>
        </div>
    </div>
</body>
</html>
